<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargar Nuevo Producto - Pancho Escobar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #070707;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-card {
            background: linear-gradient(145deg, #151515, #0a0a0a);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            padding: 35px;
            width: 100%;
            max-width: 600px;
        }

        .form-control {
            background-color: #090909;
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 15px;
            font-weight: 700;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.9);
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background-color: #0d0d0d;
            color: #fff;
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.25), inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .btn-urban-red {
            background: linear-gradient(145deg, #ff5b6b, #c9182a);
            color: #fff;
            font-weight: 900;
            border: none;
            border-radius: 12px;
            padding: 14px;
            text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: all 0.25s ease;
        }

        .btn-urban-red:hover {
            background: linear-gradient(145deg, #ff7380, #e03b4b);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 71, 87, 0.75), inset 0 2px 6px rgba(255,255,255,0.4);
        }

        .tag-badge {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid #FFD700;
            color: #FFD700;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-warning fw-bold m-0 text-uppercase">🌭 Cargar Nuevo Producto</h3>
            <a href="/admin" class="btn btn-outline-light btn-sm rounded-pill px-3">← Volver al Admin</a>
        </div>

        <form action="/productos/nuevo" method="POST" enctype="multipart/form-data" onsubmit="prepararEnvio(event)">
            
            <!-- Nombre del producto -->
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">NOMBRE DEL PRODUCTO:</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej: Pancho Escobar Stacker" required>
            </div>

            <!-- Precio -->
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">PRECIO ($):</label>
                <input type="number" step="0.01" name="precio" class="form-control" placeholder="5000" required>
            </div>

            <!-- Categoría -->
            <div class="mb-3">
                <label class="form-label text-warning small fw-bold">CATEGORÍA / ESTILO:</label>
                <input type="text" name="categoria" id="nuevo-categoria" class="form-control" placeholder="Ej: Panchos Clásicos" required>
            </div>

            <!-- Ingredientes / Toppings dinámicos -->
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">INGREDIENTES / TOPPINGS (Escribe y presiona Espacio o Enter):</label>
                <div class="p-2 rounded bg-dark border border-secondary d-flex flex-wrap gap-2 align-items-center shadow-inset" id="tags-container" onclick="document.getElementById('tag-input').focus()">
                    <input type="text" id="tag-input" class="bg-transparent border-0 text-white outline-none flex-grow-1 shadow-none" placeholder="Agregar ingrediente..." style="outline: none;">
                </div>
                <input type="hidden" name="ingredientes" id="ingredientes-hidden">
            </div>

            <!-- Imagen -->
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">IMAGEN DEL PRODUCTO:</label>
                <input type="file" name="imagen" class="form-control" accept="image/*">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-urban-red fw-bold">🚀 Guardar y Publicar Producto</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let ingredientesList = [];

        document.addEventListener('DOMContentLoaded', () => {
            const tagInput = document.getElementById('tag-input');
            if (!tagInput) return;

            tagInput.addEventListener('keydown', function(event) {
                if (event.key === ' ' || event.key === 'Enter' || event.key === ',') {
                    event.preventDefault();
                    const texto = tagInput.value.trim().replace(',', '');
                    if (texto.length > 0) {
                        if (!ingredientesList.includes(texto)) {
                            ingredientesList.push(texto);
                            renderizarTags();
                        }
                        tagInput.value = '';
                    }
                } else if (event.key === 'Backspace' && tagInput.value === '' && ingredientesList.length > 0) {
                    ingredientesList.pop();
                    renderizarTags();
                }
            });
        });

        function renderizarTags() {
            const container = document.getElementById('tags-container');
            const tagInput = document.getElementById('tag-input');
            const badges = container.querySelectorAll('.tag-badge');
            badges.forEach(b => b.remove());

            ingredientesList.forEach((ing, index) => {
                const badge = document.createElement('div');
                badge.className = 'tag-badge';
                badge.innerHTML = `
                    <span>${ing}</span>
                    <span class="text-danger ms-1" style="cursor: pointer; font-weight: 900;" onclick="eliminarIngrediente(${index})">&times;</span>
                `;
                container.insertBefore(badge, tagInput);
            });
        }

        function eliminarIngrediente(index) {
            ingredientesList.splice(index, 1);
            renderizarTags();
        }

        function prepararEnvio(event) {
            document.getElementById('ingredientes-hidden').value = JSON.stringify(ingredientesList);
        }
    </script>
</body>
</html>
